server {
    server_name game.lubi.asia;

    root /var/www/ysbzs/godot-test;
    index index.html;

    # Keep the short employee URL working for links shared before the /team-board/ prefix.
    location = /employee {
        return 302 /team-board/employee;
    }

    location = /employee/ {
        return 302 /team-board/employee/;
    }

    location = /team-board {
        return 301 /team-board/;
    }

    location /team-board/ {
        client_max_body_size 17m;
        proxy_pass http://127.0.0.1:4312/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/game.lubi.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/game.lubi.asia/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = game.lubi.asia) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name game.lubi.asia;

    location = /employee {
        return 302 /team-board/employee;
    }

    location = /employee/ {
        return 302 /team-board/employee/;
    }

    return 404;
}
