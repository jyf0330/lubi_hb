# Direct IP fallback for the team board.
# This is HTTP-only because the current TLS certificate is issued to game.lubi.asia.
server {
    listen 80;
    server_name 124.222.83.113;

    # Keep the short employee URL working for links shared before the /team-board/ prefix.
    location = /employee {
        return 302 /team-board/employee;
    }

    location = /employee/ {
        return 302 /team-board/employee/;
    }

    location = /team-board {
        return 301 /team-board/;
    }

    location /team-board/ {
        client_max_body_size 17m;
        proxy_pass http://127.0.0.1:4312/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
